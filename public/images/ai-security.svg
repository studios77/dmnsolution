<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <filter id="pulse">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Central AI Brain -->
  <circle cx="200" cy="150" r="40" fill="url(#aiGrad)" stroke="#10B981" stroke-width="3" filter="url(#pulse)"/>
  <text x="200" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">AI</text>
  <text x="200" y="160" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">Security</text>
  
  <!-- Neural Network Pattern -->
  <circle cx="170" cy="120" r="6" fill="#22C55E" opacity="0.7"/>
  <circle cx="230" cy="120" r="6" fill="#22C55E" opacity="0.7"/>
  <circle cx="170" cy="180" r="6" fill="#22C55E" opacity="0.7"/>
  <circle cx="230" cy="180" r="6" fill="#22C55E" opacity="0.7"/>
  
  <line x1="170" y1="120" x2="190" y2="140" stroke="#22C55E" stroke-width="1" opacity="0.5"/>
  <line x1="230" y1="120" x2="210" y2="140" stroke="#22C55E" stroke-width="1" opacity="0.5"/>
  <line x1="170" y1="180" x2="190" y2="160" stroke="#22C55E" stroke-width="1" opacity="0.5"/>
  <line x1="230" y1="180" x2="210" y2="160" stroke="#22C55E" stroke-width="1" opacity="0.5"/>
  
  <!-- Threat Detection Modules -->
  <rect x="50" y="50" width="80" height="50" fill="#374151" rx="8" stroke="#EF4444" stroke-width="2"/>
  <text x="90" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Deepfake</text>
  <text x="90" y="85" font-family="sans-serif" font-size="9" fill="#EF4444" text-anchor="middle">Detection</text>
  
  <rect x="270" y="50" width="80" height="50" fill="#374151" rx="8" stroke="#F59E0B" stroke-width="2"/>
  <text x="310" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Network</text>
  <text x="310" y="85" font-family="sans-serif" font-size="9" fill="#F59E0B" text-anchor="middle">IDS/IPS</text>
  
  <rect x="50" y="200" width="80" height="50" fill="#374151" rx="8" stroke="#06B6D4" stroke-width="2"/>
  <text x="90" y="220" font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Stream</text>
  <text x="90" y="235" font-family="sans-serif" font-size="9" fill="#06B6D4" text-anchor="middle">Analysis</text>
  
  <rect x="270" y="200" width="80" height="50" fill="#374151" rx="8" stroke="#8B5CF6" stroke-width="2"/>
  <text x="310" y="220" font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">LLM</text>
  <text x="310" y="235" font-family="sans-serif" font-size="9" fill="#8B5CF6" text-anchor="middle">Audit</text>
  
  <!-- Connection Lines -->
  <line x1="130" y1="75" x2="170" y2="130" stroke="#22C55E" stroke-width="2" opacity="0.8"/>
  <line x1="270" y1="75" x2="230" y2="130" stroke="#22C55E" stroke-width="2" opacity="0.8"/>
  <line x1="130" y1="225" x2="170" y2="170" stroke="#22C55E" stroke-width="2" opacity="0.8"/>
  <line x1="270" y1="225" x2="230" y2="170" stroke="#22C55E" stroke-width="2" opacity="0.8"/>
  
  <!-- Monitoring Dashboard -->
  <rect x="160" y="20" width="80" height="25" fill="#1F2937" stroke="#22C55E" rx="4"/>
  <text x="200" y="35" font-family="monospace" font-size="10" fill="#22C55E" text-anchor="middle">24/7 MONITORING</text>
  
  <!-- Threat Indicators -->
  <circle cx="30" cy="30" r="5" fill="#EF4444" opacity="0.9"/>
  <text x="40" y="35" font-family="monospace" font-size="8" fill="#EF4444">THREAT DETECTED</text>
  
  <circle cx="30" cy="45" r="5" fill="#F59E0B" opacity="0.9"/>
  <text x="40" y="50" font-family="monospace" font-size="8" fill="#F59E0B">ANALYZING...</text>
  
  <circle cx="30" cy="60" r="5" fill="#22C55E" opacity="0.9"/>
  <text x="40" y="65" font-family="monospace" font-size="8" fill="#22C55E">BLOCKED</text>
  
  <!-- Response Actions -->
  <rect x="160" y="270" width="80" height="20" fill="#1F2937" stroke="#EF4444" rx="2"/>
  <text x="200" y="283" font-family="monospace" font-size="9" fill="#EF4444" text-anchor="middle">AUTO RESPONSE</text>
  
  <!-- Security Stats -->
  <rect x="300" y="120" width="90" height="60" fill="#1F2937" stroke="#374151" rx="4"/>
  <text x="345" y="135" font-family="sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Security Stats</text>
  <text x="310" y="150" font-family="monospace" font-size="8" fill="#22C55E">Threats: 1,247</text>
  <text x="310" y="160" font-family="monospace" font-size="8" fill="#22C55E">Blocked: 1,245</text>
  <text x="310" y="170" font-family="monospace" font-size="8" fill="#EF4444">Active: 2</text>
  
  <!-- Title -->
  <text x="200" y="280" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">AI Security Platform</text>
  
  <!-- Scanning Effect -->
  <circle cx="200" cy="150" r="50" fill="none" stroke="#22C55E" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="40;60;40" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Data Flow Particles -->
  <circle cx="120" cy="100" r="2" fill="#22C55E" opacity="0.8">
    <animateMotion dur="3s" repeatCount="indefinite">
      <path d="M 0,0 Q 40,20 80,50"/>
    </animateMotion>
  </circle>
  
  <circle cx="280" cy="100" r="2" fill="#F59E0B" opacity="0.8">
    <animateMotion dur="3s" repeatCount="indefinite">
      <path d="M 0,0 Q -40,20 -80,50"/>
    </animateMotion>
  </circle>
</svg>