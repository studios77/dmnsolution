<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Data Center Building -->
  <rect x="50" y="80" width="300" height="180" fill="#374151" stroke="#6B7280" stroke-width="2"/>
  <rect x="60" y="90" width="280" height="20" fill="#4B5563"/>
  
  <!-- Server Racks -->
  <rect x="80" y="130" width="40" height="80" fill="url(#serverGrad)" rx="4"/>
  <rect x="140" y="130" width="40" height="80" fill="url(#serverGrad)" rx="4"/>
  <rect x="200" y="130" width="40" height="80" fill="url(#serverGrad)" rx="4"/>
  <rect x="260" y="130" width="40" height="80" fill="url(#serverGrad)" rx="4"/>
  
  <!-- Server Details -->
  <rect x="85" y="140" width="30" height="8" fill="#22C55E" opacity="0.8"/>
  <rect x="85" y="155" width="30" height="8" fill="#22C55E" opacity="0.8"/>
  <rect x="85" y="170" width="30" height="8" fill="#EF4444" opacity="0.8"/>
  <rect x="85" y="185" width="30" height="8" fill="#22C55E" opacity="0.8"/>
  
  <rect x="145" y="140" width="30" height="8" fill="#22C55E" opacity="0.8"/>
  <rect x="145" y="155" width="30" height="8" fill="#22C55E" opacity="0.8"/>
  <rect x="145" y="170" width="30" height="8" fill="#22C55E" opacity="0.8"/>
  <rect x="145" y="185" width="30" height="8" fill="#F59E0B" opacity="0.8"/>
  
  <!-- Network Connections -->
  <line x1="100" y1="120" x2="100" y2="130" stroke="#22C55E" stroke-width="3"/>
  <line x1="160" y1="120" x2="160" y2="130" stroke="#22C55E" stroke-width="3"/>
  <line x1="220" y1="120" x2="220" y2="130" stroke="#22C55E" stroke-width="3"/>
  <line x1="280" y1="120" x2="280" y2="130" stroke="#22C55E" stroke-width="3"/>
  
  <!-- Network Switch -->
  <rect x="140" y="115" width="120" height="10" fill="#6B7280" rx="2"/>
  <circle cx="150" cy="120" r="2" fill="#22C55E"/>
  <circle cx="170" cy="120" r="2" fill="#22C55E"/>
  <circle cx="210" cy="120" r="2" fill="#22C55E"/>
  <circle cx="250" cy="120" r="2" fill="#22C55E"/>
  
  <!-- Power and Cooling -->
  <rect x="320" y="140" width="20" height="60" fill="#F59E0B" opacity="0.7"/>
  <text x="330" y="175" font-family="monospace" font-size="8" fill="white" text-anchor="middle">PWR</text>
  
  <rect x="320" y="210" width="20" height="30" fill="#06B6D4" opacity="0.7"/>
  <text x="330" y="228" font-family="monospace" font-size="8" fill="white" text-anchor="middle">COOL</text>
  
  <!-- Status Indicators -->
  <circle cx="70" cy="100" r="4" fill="#22C55E"/>
  <text x="80" y="105" font-family="sans-serif" font-size="10" fill="#22C55E">99.99% UPTIME</text>
  
  <circle cx="250" cy="100" r="4" fill="#22C55E"/>
  <text x="260" y="105" font-family="sans-serif" font-size="10" fill="#22C55E">HA ACTIVE</text>
  
  <!-- Title -->
  <text x="200" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">AIDC Infrastructure</text>
  <text x="200" y="50" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Advanced Intelligent Data Center</text>
  
  <!-- Monitoring Dashboard -->
  <rect x="60" y="240" width="60" height="15" fill="#1F2937" stroke="#374151"/>
  <text x="90" y="250" font-family="monospace" font-size="8" fill="#22C55E" text-anchor="middle">MONITORING</text>
  
  <rect x="140" y="240" width="60" height="15" fill="#1F2937" stroke="#374151"/>
  <text x="170" y="250" font-family="monospace" font-size="8" fill="#22C55E" text-anchor="middle">BACKUP</text>
  
  <rect x="220" y="240" width="60" height="15" fill="#1F2937" stroke="#374151"/>
  <text x="250" y="250" font-family="monospace" font-size="8" fill="#22C55E" text-anchor="middle">SECURITY</text>
</svg>