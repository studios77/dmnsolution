<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Main Server -->
  <rect x="160" y="120" width="80" height="60" fill="url(#streamGrad)" rx="8" stroke="#A855F7" stroke-width="2"/>
  <text x="200" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Ultrastream</text>
  <text x="200" y="160" font-family="monospace" font-size="10" fill="#C4B5FD" text-anchor="middle">Engine Core</text>
  
  <!-- Input Sources -->
  <rect x="30" y="80" width="60" height="40" fill="#374151" rx="4" stroke="#6B7280"/>
  <text x="60" y="95" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">RTMP</text>
  <text x="60" y="110" font-family="sans-serif" font-size="10" fill="#22C55E" text-anchor="middle">INPUT</text>
  
  <rect x="30" y="140" width="60" height="40" fill="#374151" rx="4" stroke="#6B7280"/>
  <text x="60" y="155" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">WEBRTC</text>
  <text x="60" y="170" font-family="sans-serif" font-size="10" fill="#22C55E" text-anchor="middle">INPUT</text>
  
  <!-- Input Arrows -->
  <path d="M 90 100 L 150 140" stroke="#22C55E" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M 90 160 L 150 150" stroke="#22C55E" stroke-width="3" marker-end="url(#arrowGreen)"/>
  
  <!-- Output Streams -->
  <rect x="310" y="60" width="60" height="35" fill="#1F2937" rx="4" stroke="#22C55E"/>
  <text x="340" y="75" font-family="sans-serif" font-size="9" fill="#22C55E" text-anchor="middle">LL-HLS</text>
  <text x="340" y="87" font-family="monospace" font-size="8" fill="white" text-anchor="middle">1-2s delay</text>
  
  <rect x="310" y="110" width="60" height="35" fill="#1F2937" rx="4" stroke="#F59E0B"/>
  <text x="340" y="125" font-family="sans-serif" font-size="9" fill="#F59E0B" text-anchor="middle">DASH</text>
  <text x="340" y="137" font-family="monospace" font-size="8" fill="white" text-anchor="middle">Adaptive</text>
  
  <rect x="310" y="160" width="60" height="35" fill="#1F2937" rx="4" stroke="#06B6D4"/>
  <text x="340" y="175" font-family="sans-serif" font-size="9" fill="#06B6D4" text-anchor="middle">WebRTC</text>
  <text x="340" y="187" font-family="monospace" font-size="8" fill="white" text-anchor="middle">Ultra-low</text>
  
  <rect x="310" y="210" width="60" height="35" fill="#1F2937" rx="4" stroke="#8B5CF6"/>
  <text x="340" y="225" font-family="sans-serif" font-size="9" fill="#8B5CF6" text-anchor="middle">HLS</text>
  <text x="340" y="237" font-family="monospace" font-size="8" fill="white" text-anchor="middle">Standard</text>
  
  <!-- Output Arrows -->
  <path d="M 240 135 L 300 77" stroke="#22C55E" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M 240 145 L 300 127" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <path d="M 240 155 L 300 177" stroke="#06B6D4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M 240 165 L 300 227" stroke="#8B5CF6" stroke-width="3" marker-end="url(#arrowPurple)"/>
  
  <!-- Processing Indicators -->
  <circle cx="200" cy="100" r="8" fill="#22C55E" opacity="0.8" filter="url(#glow)"/>
  <text x="200" y="90" font-family="monospace" font-size="8" fill="#22C55E" text-anchor="middle">ENCODE</text>
  
  <circle cx="170" cy="200" r="8" fill="#F59E0B" opacity="0.8" filter="url(#glow)"/>
  <text x="170" y="220" font-family="monospace" font-size="8" fill="#F59E0B" text-anchor="middle">TRANSCODE</text>
  
  <circle cx="230" cy="200" r="8" fill="#06B6D4" opacity="0.8" filter="url(#glow)"/>
  <text x="230" y="220" font-family="monospace" font-size="8" fill="#06B6D4" text-anchor="middle">PACKAGE</text>
  
  <!-- Stats Panel -->
  <rect x="30" y="220" width="120" height="50" fill="#1F2937" stroke="#374151" rx="4"/>
  <text x="90" y="235" font-family="sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Live Stats</text>
  <text x="40" y="248" font-family="monospace" font-size="8" fill="#22C55E">Viewers: 15,234</text>
  <text x="40" y="258" font-family="monospace" font-size="8" fill="#22C55E">Bitrate: 5.2 Mbps</text>
  
  <!-- Title -->
  <text x="200" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Streaming Engine</text>
  <text x="200" y="50" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Ultra-low Latency Broadcasting</text>
  
  <!-- Arrow Markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 0,6 9,3" fill="#22C55E"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 0,6 9,3" fill="#F59E0B"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 0,6 9,3" fill="#06B6D4"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 0,6 9,3" fill="#8B5CF6"/>
    </marker>
  </defs>
</svg>